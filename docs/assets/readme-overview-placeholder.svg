<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">高考填志愿.agent 项目截图占位</title>
  <desc id="desc">用于 README 的首页、聊天和运营后台截图占位图，后续替换为真实脱敏截图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="0.55" stop-color="#0b3441"/>
      <stop offset="1" stop-color="#145b54"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62e6c4"/>
      <stop offset="1" stop-color="#9bd6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1440" height="720" rx="28" fill="url(#background)"/>
  <circle cx="1260" cy="90" r="240" fill="#62e6c4" opacity="0.08"/>
  <circle cx="160" cy="680" r="260" fill="#78a7ff" opacity="0.08"/>

  <text x="96" y="112" fill="#f4fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">高考填志愿.agent</text>
  <text x="96" y="158" fill="#b9d8df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">AI Agent × 结构化高考知识 × 多渠道运营</text>
  <rect x="96" y="188" width="420" height="5" rx="2.5" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="248" width="388" height="328" rx="20" fill="#f7fbfc"/>
    <rect x="526" y="218" width="388" height="358" rx="20" fill="#f7fbfc"/>
    <rect x="956" y="248" width="388" height="328" rx="20" fill="#f7fbfc"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="130" cy="282" r="6" fill="#ff786b"/>
    <circle cx="150" cy="282" r="6" fill="#ffc45c"/>
    <circle cx="170" cy="282" r="6" fill="#5fd79b"/>
    <text x="126" y="344" fill="#143544" font-size="26" font-weight="700">公开内容</text>
    <text x="126" y="382" fill="#55727d" font-size="18">学校与专业目录</text>
    <text x="126" y="412" fill="#55727d" font-size="18">榜单来源与相关推荐</text>
    <rect x="126" y="452" width="300" height="72" rx="12" fill="#e4f5f1"/>
    <text x="150" y="495" fill="#247466" font-size="18" font-weight="600">HOME SCREENSHOT</text>

    <circle cx="560" cy="252" r="6" fill="#ff786b"/>
    <circle cx="580" cy="252" r="6" fill="#ffc45c"/>
    <circle cx="600" cy="252" r="6" fill="#5fd79b"/>
    <text x="556" y="322" fill="#143544" font-size="26" font-weight="700">Agent 对话</text>
    <text x="556" y="360" fill="#55727d" font-size="18">Skill 路由与结构化结果</text>
    <text x="556" y="390" fill="#55727d" font-size="18">模型失败时确定性降级</text>
    <rect x="556" y="430" width="300" height="94" rx="12" fill="#e7f0ff"/>
    <text x="580" y="485" fill="#3d6fba" font-size="18" font-weight="600">CHAT SCREENSHOT</text>

    <circle cx="990" cy="282" r="6" fill="#ff786b"/>
    <circle cx="1010" cy="282" r="6" fill="#ffc45c"/>
    <circle cx="1030" cy="282" r="6" fill="#5fd79b"/>
    <text x="986" y="344" fill="#143544" font-size="26" font-weight="700">运营后台</text>
    <text x="986" y="382" fill="#55727d" font-size="18">审核、权益与媒体事件</text>
    <text x="986" y="412" fill="#55727d" font-size="18">精选内容和榜单维护</text>
    <rect x="986" y="452" width="300" height="72" rx="12" fill="#f1eafe"/>
    <text x="1010" y="495" fill="#7652ad" font-size="18" font-weight="600">ADMIN SCREENSHOT</text>

    <text x="720" y="650" text-anchor="middle" fill="#d7e9ed" font-size="20">Screenshot placeholder · 后续替换为真实、脱敏、可复现的 Demo 截图</text>
  </g>
</svg>
